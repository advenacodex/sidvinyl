MEMORY {
    ZP:   start = $0002, size = $007E, type = rw;
    LOAD: start = $07FF, size = $0002, type = ro, file = %O;
    RAM:  start = $0801, size = $6000, type = rw, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    LOADADDR: load = LOAD, type = ro;
    STUB:     load = RAM,  type = ro;
    CODE:     load = RAM,  type = ro;
    BSS:      load = RAM,  type = bss, define = yes;
}
