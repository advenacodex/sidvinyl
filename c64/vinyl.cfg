# Code/BASIC stub live below the bitmap ($0801-$1FFF); read-only data sits in the
# free gap after the disc blob ($7400-$7FFF). The PRG file is zero-filled between.
MEMORY {
    ZP:       file = "",     start = $0002, size = $00FE;
    LOADADDR: file = %O,     start = $07FF, size = $0002;
    MAIN:     file = %O,     start = $0801, size = $17FF, fill = yes;
    GAP:      file = %O,     start = $2000, size = $5400, fill = yes;
    DATA:     file = %O,     start = $7400, size = $0BF0;
    BSSMEM:   file = "",     start = $EF00, size = $0100;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    BASIC:    load = MAIN,     type = ro;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = DATA,     type = ro;
    CODE2:    load = DATA,     type = ro;
    BSS:      load = BSSMEM,   type = bss;
}
